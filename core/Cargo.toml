[package]
name = "vivy-core"
version = "0.1.0"
description = "Vivy's engine: the phone agent, phone connection, settings and chats"
edition = "2021"
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.26"
futures-util = "0.3"
# rustls instead of the system TLS library, so Linux builds don't need OpenSSL.
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "http2", "charset"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
base64 = "0.22"
dirs = "6"
# Secure phone pairing: TLS with a self-made certificate, HMAC proofs.
# The ring backend avoids needing CMake/NASM to build on Windows.
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
rcgen = "0.13"
hmac = "0.12"
sha2 = "0.10"
rand = "0.8"

# Each system's own keyring. Without a matching feature keyring silently uses
# an in-memory mock, which is why settings once vanished after saving.
[target.'cfg(windows)'.dependencies]
keyring = { version = "3", features = ["windows-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
# Secret Service (GNOME Keyring, KWallet). `vendored` builds libdbus from
# source, so no -dev packages are needed.
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust", "vendored"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }
